[project]
name = "previsao-demanda-estoque"
version = "0.1.0"
description = "Previsão de demanda e plano de reposição de estoque (Python, scikit-learn)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.scripts]
previsao-demanda = "previsao_demanda_estoque.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["previsao_demanda_estoque"]
